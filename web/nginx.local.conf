# Local `docker compose up` only (mounted over default.conf): the SPA plus /api proxied to the api service.
# Production uses web/nginx.conf; the host nginx routes /api there.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://api:8020; }

    location /assets/ { try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
