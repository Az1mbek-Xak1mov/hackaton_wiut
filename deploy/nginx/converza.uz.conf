limit_req_zone $binary_remote_addr zone=converza_analyse:10m rate=10r/m;

server {
    server_name converza.uz www.converza.uz app.converza.uz;
    access_log /var/log/nginx/converza.access.log;
    error_log  /var/log/nginx/converza.error.log;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location = /api/v1/analyse {
        limit_req zone=converza_analyse burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8050;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 70s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8050;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 70s;
    }
    location = /health { proxy_pass http://127.0.0.1:8050; }
    location / {
        proxy_pass http://127.0.0.1:8051;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/converza.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/converza.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot





}


server {
    if ($host = app.converza.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.converza.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = converza.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name converza.uz www.converza.uz app.converza.uz;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot






}