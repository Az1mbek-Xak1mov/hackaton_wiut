# Ordered purpose-text rules for bank-statement categorisation (first match wins).
# Patterns are Python regexes applied to normalised text: lower-case, apostrophes unified to ',
# ё→е, VAT mentions inside ordinary payments ("в т.ч. НДС 12% …") removed. "." stands for any char
# so "to.lov" matches to'lov / to‘lov / toʻlov.
# direction: in (credit), out (debit), any. Own STIR → own_transfer is applied before these rules.
- category: own_transfer
  direction: any
  patterns:
    - 'перевод\w*\s+(собственн|своих)'
    - 'между\s+(своими|собственными)\s+сч'
    - '(со\s+своего|на\s+свой)\s+сч'
    - 'o.z\s+hisob'
    - 'o.z\s+mablag'
    - 'собственн\w*\s+средств'
    - 'own\s+account'
- category: loan_disbursement
  direction: in
  patterns:
    - 'выдач[аи]\s+(кредит|ссуд|займ)'
    - 'предоставлен\w*\s+(кредит|ссуд|займ)'
    - 'зачислен\w*\s+(кредит|займ)'
    - 'получен\w*\s+(кредит|займ)'
    - 'кредитн\w*\s+средств'
    - 'kredit\s+(mablag|ajrat|berish|berildi)'
    - 'qarz\s+(mablag|berildi)'
    - 'loan\s+disburs'
- category: loan_repayment
  direction: out
  counterparty:
    - 'kreditni\s+qaytarish'
    - 'kredit\s+hisob'
    - 'ссудн\w*\s+сч'
    - 'погашени\w*\s+кредит'
  patterns:
    - 'kredit\s+shartnoma'
    - 'navbatdagi\s+to.lov'
    - 'очередн\w*\s+(платеж|взнос)\s+по\s+кредит'
    - 'погаш\w*\.?\s+(основн|кредит|ссуд|займ|процент)'
    - 'основн\w*\s+долг'
    - 'процент\w*\s+(по|за)\s+(кредит|ссуд|займ)'
    - '(возврат|погашение)\s+(кредит|займ|ссуд)'
    - 'задолженност\w*\s+по\s+(кредит|займ|ссуд)'
    - 'лизинг\w*\s+(платеж|плат)'
    - 'кредитн\w*\s+договор'
    - 'kredit\w*\s+(qaytar|to.lov|foiz)'
    - 'asosiy\s+qarz'
    - 'асосий\s+қарз'
    - 'kredit\w*\s+bo.yicha\s+(foiz|to.lov|qarz|asosiy)'
    - 'кредит\w*\s+(бўйича|қайтар)'
    - 'фоиз'
    - 'qarz\w*\s+(to.la|to.lov|so.ndir|qaytar)'
    - 'foiz\w*\s+(to.la|to.lov)'
    - 'lizing\s+to.lov'
    - 'loan\s+(repayment|instal)'
    - 'interest\s+on\s+(the\s+)?loan'
- category: payroll_tax
  direction: out
  patterns:
    - 'инпс'
    - 'индивидуальн\w*\s+накопительн'
    - 'социальн\w*\s+налог'
    - 'соц\.?\s*налог'
    - 'ндфл'
    - 'подоходн\w*\s+налог'
    - 'налог\w*\s+на\s+доходы\s+физ'
    - 'ijtimoiy\s+soli(q|g.)'
    - 'ижтимоий\s+солиқ'
    - 'jismoniy\s+shaxs\w*\s+daromad'
    - 'jshds'
    - 'shaxsiy\s+jamg.arib'
    - 'пенсион'
    - 'pension'
    - 'payroll\s+tax'
    - 'social\s+(tax|contribution)'
- category: salary
  direction: out
  patterns:
    - 'заработн'
    - 'зарплат'
    - 'зар\.\s*плат'
    - '(^|\s)з/п'
    - 'оплат\w*\s+труд'
    - 'карт\w*\s+(сотрудник|работник)'
    - 'ish\s+haq'
    - 'иш\s+ҳақ'
    - 'oylik\s+(ish\s+haq|maosh)'
    - 'maosh'
    - 'mehnat\s+haq'
    - 'xodim\w*\s+(plastik|karta)'
    - 'plastik\s+kart\w*\s+xodim'
    - 'salary'
    - 'payroll'
    - 'wages'
- category: bank_fee
  direction: out
  patterns:
    - 'комисси'
    - 'услуг\w*\s+банка'
    - 'обслуживан\w*\s+сч'
    - 'bank\s+xizmat'
    - 'komissiya'
    - 'hisob\w*\s+xizmat'
    - 'bank\s+(fee|charge|commission)'
    - 'kassa\s+xizmat'
    - 'расчетно-кассов'
    - '(^|\s)sms'
    - 'информирован'
    - 'xabardor\s+qilish'
- category: tax
  direction: out
  counterparty:
    - 'soliq\s+qo.mita'
    - 'налогов\w*\s+(комитет|инспекц)'
    - 'g.aznachilik'
    - 'казначейств'
    - '(^|\s)budjet'
    - 'бюджет'
  patterns:
    - '(уплат\w*|оплат\w*|перечислен\w*)\s+(налог|ндс|акциз)'
    - 'налог\s+на\s+(прибыль|имущество|добавленн|землю|доход)'
    - 'ндс\s+за\s'
    - 'единый\s+налог'
    - 'в\s+бюджет'
    - 'казначейств'
    - 'g.aznachilik'
    - 'soli(q|g.)'
    - 'солиқ'
    - 'qqs\s+(to.lov|uchun)'
    - '^qqs\b'
    - 'qo.shilgan\s+qiymat'
    - 'davlat\s+boj'
    - 'госпошлин'
    - 'налог'
    - '\btax\b'
    - '\bvat\s+payment'
- category: rent_utilities
  direction: out
  patterns:
    - 'аренд'
    - 'ijara'
    - 'ижара'
    - 'электр\s+энерг'
    - 'электроэнерг'
    - 'электричеств'
    - 'elektr\s*energ'
    - 'elektr\s+(ta.minot|tarmoq)'
    - 'hududiy\s+elektr'
    - 'природн\w*\s+газ'
    - '(^|\s)газ(\s|$|\W)'
    - '(^|\s)gaz(\s|$|\W)'
    - 'водоснабж'
    - 'водоканал'
    - 'холодн\w*\s+вод'
    - 'канализац'
    - 'ichimlik\s+suv'
    - 'suv\w*\s+(uchun|ta.minot)'
    - '(^|\s)suv(\s|$|\W)'
    - 'коммунал'
    - 'kommunal'
    - 'тепл\w*\s*снаб'
    - 'issiqlik'
    - 'услуг\w*\s+связи'
    - 'интернет'
    - 'internet'
    - 'telefon'
    - 'aloqa\s+xizmat'
    - '\brent\b'
    - 'utilit'
- category: cash_withdrawal
  direction: out
  patterns:
    - 'сняти\w*\s+наличн'
    - 'получени\w*\s+наличн'
    - 'выдач\w*\s+наличн'
    - 'наличн\w*\s+(денеж|средств)'
    - '(^|\s)чек\s*№'
    - 'naqd\s+pul'
    - 'cash\s+withdraw'
- category: other
  direction: any
  patterns:
    - 'возврат\w*\s+(ошибочн|предоплат|излишн)'
    - 'xato\s+o.tkazil'
    - 'благотворит'
    - 'homiylik'
    - 'членск\w*\s+взнос'
    - 'a.zolik\s+badal'
    - 'штраф'
    - 'jarima'
    - 'обучени\w*\s+сотрудник'
- category: sales_receipt
  direction: in
  patterns:
    - 'за\s+(товар|продукц|услуг|работ|поставк)'
    - 'предоплат'
    - 'аванс'
    - 'выручк'
    - 'реализац'
    - 'сч[её]т-фактур'
    - '(^|\s)с/ф'
    - 'tovar'
    - 'mahsulot'
    - 'xizmat'
    - 'hisob.faktura'
    - '(^|\s)h/f'
    - 'oldindan\s+to.lov'
    - 'invoice'
    - '\bsale'
    - '\bgoods'
- category: supplier_payment
  direction: out
  patterns:
    - 'за\s+(товар|продукц|услуг|работ|сыр|материал|поставк|пряж|упаков|транспорт|комплектующ)'
    - 'предоплат'
    - 'аванс'
    - 'сч[её]т-фактур'
    - '(^|\s)с/ф'
    - 'tovar'
    - 'mahsulot'
    - 'xom\s*ash'
    - 'xizmat'
    - 'material'
    - 'hisob.faktura'
    - '(^|\s)h/f'
    - 'oldindan\s+to.lov'
    - 'invoice'
    - 'purchase'
    - '\bgoods'
