# Line-code dictionary for the Uzbek NSBU statutory financial statements.
#   form1 = Buxgalteriya balansi / Бухгалтерский баланс (1-son shakl / Форма №1)
#   form2 = Moliyaviy natijalar to'g'risidagi hisobot / Отчёт о финансовых результатах (2-son shakl / Форма №2)
#
# source: >
#   MoF order No. 140 of 27.12.2002 "Об утверждении форм финансовой отчетности и правил по их заполнению"
#   (reg. No. 1209 of 24.01.2003), appendices 1 (Form 1) and 2 (Form 2) as amended by MoF order No. 10 of
#   23.01.2019 (reg. No. 1209-10 of 15.02.2019). Text: https://lex.uz/docs/771825
#   Codes, formulas and the RU / UZ-Cyrillic labels were checked against that page on 2026-10-10.
#   UZ-Latin labels are our transliteration of the official UZ-Cyrillic text; EN labels are ours.
#   Not every official line is listed: totals whose children are not all listed use `parts`, not `sum_of`.
#
# Differences from the design artboards (design/demo-data.json), resolved in favour of this dictionary
# (docs/plan/02-PIPELINE.md §3: "the dictionary wins"):
#   - form2 finance costs are line 170 (design said 120; 120 is dividend income)
#   - form2 profit tax is line 250 (design said 240; 240 is profit before tax)
#   - form1 total liabilities + equity is line 780 (770 is the total of liabilities, section II)
#   - form2 line 080 does not exist in the 2019 edition; 040 = 050 + 060 + 070
# Consumers should look entries up by `slug` (stable meaning), not by code.
#
# Schema per entry:
#   form, code, slug, section, side (asset|equity|liability|pnl), kind (amount|result|total)
#   labels: {uz_latn: [...], uz_cyrl: [...], ru: [...], en: [...]}   first label = canonical display label
#   sum_of: exhaustive formula over codes; "-" prefix subtracts.   parent == Σ(children)
#   parts:  non-exhaustive "of which" children (each child <= parent; not summed)
#   result lines (kind: result) can be negative; on the 4-column Form 2 a loss is printed in the expense column.

meta:
  version: 1
  verification: "codes, formulas, RU and UZ-Cyrillic labels checked against https://lex.uz/docs/771825 (edition of 23.01.2019) on 2026-10-10"
  unit_default: kUZS
  checks:
    - id: balance
      description: "Total assets equal total equity and liabilities"
      lhs: ["form1.400"]
      rhs: ["form1.780"]

