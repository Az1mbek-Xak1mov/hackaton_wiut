[project]
name = "converza"
version = "0.0.0"
requires-python = "~=3.12.0"
dependencies = [
  "fastapi", "fastapi-pagination", "uvicorn[standard]", "python-multipart",
  "sqlalchemy>=2", "alembic", "psycopg2-binary", "pydantic>=2", "pydantic-settings",
  "httpx", "pyjwt", "pwdlib[argon2]", "tzdata",
  "pdfplumber", "pypdfium2", "pytesseract", "opencv-python-headless", "numpy", "pillow",
  "openpyxl", "rapidfuzz", "scikit-learn", "joblib", "pyyaml", "openai",
]

[dependency-groups]
dev = ["pytest"]
eval = ["reportlab", "img2pdf"]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
